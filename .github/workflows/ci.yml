name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q
      - run: node --check web/app.mjs && node --check web/calc.mjs && node --check web/v2.mjs && node --check web/v2calc.mjs
      - run: node tests/calc.test.mjs && node tests/v2.test.mjs && node tests/lookup.test.mjs
      - run: docker build -t sound-truck-power-planner:test .
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sample-engineering-report
          path: artifacts/sample-engineering-report.pdf
          retention-days: 7
