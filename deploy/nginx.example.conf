# Example only. Adapt into the existing HTTPS proxy; not installed by Compose.
# These limit_*_zone directives belong in nginx's http {} context.
limit_req_zone $binary_remote_addr zone=planner_api:1m rate=2r/s;
limit_req_zone $binary_remote_addr zone=planner_heavy:1m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=planner_clients:1m;
limit_conn_zone $server_name zone=planner_server:1m;

server {
    listen 443 ssl;
    server_name planner.example.org;
    ssl_certificate /etc/ssl/planner/fullchain.pem;
    ssl_certificate_key /etc/ssl/planner/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;
    client_max_body_size 128k;
    client_body_timeout 15s;
    client_header_timeout 10s;
    send_timeout 20s;
    limit_req_status 429;
    limit_conn_status 503;
    limit_conn planner_clients 10;
    limit_conn planner_server 24;
    proxy_connect_timeout 3s;
    proxy_send_timeout 20s;
    proxy_read_timeout 20s;
    # Overwrite, rather than append to, client-supplied forwarding headers.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_request_buffering on;

    location ^~ /api/v1/catalog/ {
        # Replace with an explicit VPN/admin allowlist if shared writes are needed.
        deny all;
    }
    location = /api/v3/library/import { deny all; }
    location = /api/v1/reports/engineering.pdf {
        client_max_body_size 2m;
        limit_req zone=planner_heavy burst=2 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }
    location = /api/v3/library/validate {
        client_max_body_size 8m;
        limit_req zone=planner_heavy burst=2 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }
    location = /api/v2/specs/inspect {
        limit_req zone=planner_heavy burst=2 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }
    location /api/ {
        limit_req zone=planner_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }
    location / { proxy_pass http://127.0.0.1:8080; }
}

server {
    listen 80;
    server_name planner.example.org;
    return 308 https://planner.example.org$request_uri;
}
