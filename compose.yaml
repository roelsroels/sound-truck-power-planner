services:
  planner:
    build: .
    image: sound-truck-power-planner:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    environment:
      DB_PATH: /data/planner.sqlite3
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      - planner_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m

volumes:
  planner_data:
